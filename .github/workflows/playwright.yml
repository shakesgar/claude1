name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # CI=true is set by GitHub Actions; the config uses it to start a fresh app server in test mode.
      # RETRIES overrides "retries" in testsettings.json, which is 0 for local runs.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          RETRIES: 2

      # Reads test-results/results.json (written by the json reporter) and adds totals
      # and a table of failed and flaky tests to the run's summary page
      - name: Write job summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.js

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      # Traces, failure screenshots and the raw JSON results
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
